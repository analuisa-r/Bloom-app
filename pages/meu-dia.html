<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu dia - Bloom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/cabecalho.css">
  <link rel="stylesheet" href="../css/paginas.css">
</head>
<body class="pagina">
  <header id="cabecalho" data-pagina="meu-dia" data-raiz=".."></header>

  <main class="conteudo">
    <section class="saudacao">
      <h1 id="saudacao" data-texto="tratamento.boasVindas"></h1>
      <p id="data-hoje" class="texto-suave"></p>
    </section>

    <p id="mensagem" class="mensagem" role="status"></p>

    <form id="form-nome" class="cartao" hidden>
      <label class="campo-rotulo" for="campo-nome" data-texto="tratamento.perguntaNome"></label>
      <input class="campo-entrada" id="campo-nome" type="text" maxlength="30" autocomplete="given-name" placeholder="Seu nome">
      <button class="botao botao-bloco" type="submit" style="margin-top: var(--espaco-4)">Começar</button>
    </form>

    <div id="painel" class="meu-dia-grade" hidden>
      <div class="coluna">
        <section class="cartao" aria-labelledby="titulo-energia">
          <h2 id="titulo-energia">Como está sua energia hoje?</h2>
          <div class="energia-opcoes">
            <button type="button" class="opcao" data-nivel="baixa" aria-pressed="false">
              <svg class="ilustracao" width="64" height="96" aria-hidden="true"><use href="../assets/icones.svg#flor-botao"></use></svg>
              <strong data-texto="energia.baixa.nome"></strong><span data-texto="energia.baixa.estagio"></span>
            </button>
            <button type="button" class="opcao" data-nivel="média" aria-pressed="false">
              <svg class="ilustracao" width="64" height="96" aria-hidden="true"><use href="../assets/icones.svg#flor-abrindo"></use></svg>
              <strong data-texto="energia.média.nome"></strong><span data-texto="energia.média.estagio"></span>
            </button>
            <button type="button" class="opcao" data-nivel="alta" aria-pressed="false">
              <svg class="ilustracao" width="64" height="96" aria-hidden="true"><use href="../assets/icones.svg#flor-florida"></use></svg>
              <strong data-texto="energia.alta.nome"></strong><span data-texto="energia.alta.estagio"></span>
            </button>
          </div>
          <p id="energia-aviso" class="aviso" style="margin-bottom: 0"></p>
        </section>

        <section class="cartao" aria-labelledby="titulo-habitos">
          <div class="cartao-topo">
            <h2 id="titulo-habitos">Seus hábitos de hoje</h2>
            <a href="habitos.html">Ver todos</a>
          </div>
          <p id="lista-vazia">Você ainda não tem hábitos. <a href="habitos.html">Plante o primeiro</a>.</p>
          <ul id="lista-habitos" class="lista-checklist"></ul>
        </section>
      </div>

      <div class="coluna">
        <section class="cartao" aria-labelledby="titulo-jardim">
          <div class="cartao-topo">
            <h2 id="titulo-jardim">Seu jardim</h2>
            <p id="jardim-percentual" class="jardim-percentual">0%</p>
          </div>
          <p id="jardim-texto"></p>
          <div id="jardim-barra" class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="jardim-texto">
            <div id="jardim-preenchido" class="barra-preenchida"></div>
          </div>
          <ul id="jardim" class="jardim-lista"></ul>
        </section>
      </div>
    </div>
  </main>

  <script src="../js/storage.js"></script>
  <script src="../js/dados.js"></script>
  <script src="../js/textos.js"></script>
  <script src="../js/svg.js"></script>
  <script src="../js/cabecalho.js"></script>
  <script src="../js/interface.js"></script>
  <script src="../js/lista-habitos.js"></script>
  <script src="../js/meu-dia.js"></script>
</body>
</html>
