<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metas - Bloom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/cabecalho.css">
  <link rel="stylesheet" href="../css/paginas.css">
</head>
<body class="pagina">
  <header id="cabecalho" data-pagina="metas" data-raiz=".."></header>

  <main class="conteudo">
    <section class="saudacao">
      <h1>Minhas metas</h1>
      <p class="texto-suave">Escolha um prazo que caiba na sua vida.</p>
    </section>

    <p id="mensagem" class="mensagem" role="status"></p>

    <div class="grade-duas">
      <div class="coluna">
        <section class="cartao" aria-labelledby="titulo-resumo">
          <div class="cartao-topo">
            <h2 id="titulo-resumo">Metas cuidadas</h2>
            <p id="resumo-percentual" class="percentual-grande">0%</p>
          </div>
          <p id="resumo-texto"></p>
          <div id="resumo-barra" class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="resumo-texto">
            <div id="resumo-preenchido" class="barra-preenchida"></div>
          </div>
        </section>

        <section class="cartao" aria-labelledby="titulo-lista">
          <h2 id="titulo-lista">Em cultivo</h2>
          <p id="lista-vazia">Você ainda não tem metas. Plante a primeira ao lado.</p>
          <ul id="lista-metas" class="lista-checklist"></ul>
        </section>
      </div>

      <div class="coluna">
        <form id="form-meta" class="cartao" novalidate>
          <h2 id="titulo-form">Plantar uma meta</h2>
          <label class="campo-rotulo" for="campo-titulo">Título</label>
          <input class="campo-entrada" id="campo-titulo" type="text" maxlength="60" placeholder="Ex.: Terminar o curso de inglês">
          <label class="campo-rotulo" for="campo-descricao">Descrição (opcional)</label>
          <textarea class="campo-entrada" id="campo-descricao" maxlength="200" placeholder="Por que essa meta é importante para você?"></textarea>
          <label class="campo-rotulo" for="campo-prazo">Data-alvo</label>
          <input class="campo-entrada" id="campo-prazo" type="date">
          <label class="campo-rotulo" for="campo-andamento">Andamento</label>
          <select class="campo-entrada" id="campo-andamento"></select>
          <button id="botao-salvar" class="botao botao-bloco" type="submit" style="margin-top: var(--espaco-4)">Adicionar meta</button>
          <button id="botao-cancelar" class="botao botao-secundario botao-bloco" type="button" style="margin-top: var(--espaco-2)" hidden>Cancelar edição</button>
        </form>
      </div>
    </div>
  </main>

  <script src="../js/storage.js"></script>
  <script src="../js/dados.js"></script>
  <script src="../js/textos.js"></script>
  <script src="../js/svg.js"></script>
  <script src="../js/cabecalho.js"></script>
  <script src="../js/interface.js"></script>
  <script src="../js/lista-habitos.js"></script>
  <script src="../js/metas.js"></script>
</body>
</html>
