<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus hábitos - Bloom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body class="pagina-app">
  <header class="topo">
    <a class="logo" href="../index.html">Bloom 🌸</a>
    <nav class="menu-principal" aria-label="Principal">
      <a href="meu-dia.html">Meu dia</a>
      <a href="habitos.html" aria-current="page">Hábitos</a>
      <a href="metas.html">Metas</a>
    </nav>
  </header>

  <main class="app">
    <div class="titulo-pagina">
      <div>
        <p class="rotulo">Hoje</p>
        <h1>Meus hábitos</h1>
      </div>
      <p class="faixa-energia">
        Energia de hoje: <strong id="energia-atual"></strong>
        <a id="link-energia" href="meu-dia.html">mudar</a>
      </p>
    </div>

    <p id="mensagem" class="mensagem" role="status"></p>

    <div class="painel">
      <div class="coluna">
        <section class="cartao-app">
          <p id="aviso-energia" class="aviso-energia"></p>
          <p id="lista-vazia">Você ainda não tem hábitos. Plante o primeiro ao lado.</p>
          <ul id="lista-habitos" class="lista-habitos"></ul>
        </section>
      </div>

      <div class="coluna">
        <form id="form-habito" class="cartao-app">
          <p class="rotulo">Novo hábito</p>
          <h2>Plantar uma semente</h2>
          <label for="campo-habito">Nome do hábito</label>
          <input id="campo-habito" type="text" maxlength="60" placeholder="Ex.: Meditar">
          <label for="campo-categoria">Categoria</label>
          <select id="campo-categoria"></select>
          <label for="campo-minima">Versão mínima (opcional)</label>
          <input id="campo-minima" type="text" maxlength="60" placeholder="Ex.: 2 minutos de respiração">
          <p class="ajuda">O menor passo possível para os dias de pouca energia.</p>
          <button class="botao" type="submit">Adicionar hábito</button>
        </form>
      </div>
    </div>
  </main>

  <script src="../js/storage.js"></script>
  <script src="../js/dados.js"></script>
  <script src="../js/interface.js"></script>
  <script src="../js/habitos.js"></script>
</body>
</html>
